<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD Level Viewer</title>
<style>
  :root { --bg:#0b0620; --panel:#160d33; --ink:#e8e4ff; --dim:#8b84b8; --block:#3d7bff; --spike:#ff3b6b; --cube:#3dffb0; --click:#ffe14d; --win:rgba(255,225,77,.13); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:var(--panel); }
  header h1 { font-size:15px; margin:0 8px 0 0; letter-spacing:.04em; color:var(--cube); }
  header { position:relative; }
  #viewMenu { position:absolute; right:16px; top:100%; z-index:60; display:flex; flex-wrap:wrap; gap:6px; max-width:min(440px, calc(100vw - 32px)); padding:10px; background:var(--panel); border:1px solid #2b2060; border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #viewMenu[hidden] { display:none; }
  header.compact { flex-wrap:nowrap; gap:6px; padding:6px 10px; overflow:visible; }
  header.compact > #ctxbar { flex-basis:100%; }
  header.compact { flex-wrap:wrap; row-gap:0; }
  header .lbl { white-space:nowrap; }
  header.compact > button .lbl, header.compact > label .lbl { display:none; }
  header.compact h1 { display:none; }
  #pickBtn { max-width:min(34vw, 300px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #runChip { max-width:min(40vw, 380px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header.compact #pickBtn { max-width:20vw; } header.compact #runChip { max-width:30vw; }
  #ctxbar { flex-basis:100%; display:flex; flex-direction:column; gap:0; margin:2px -16px -10px; }
  #ctxbar:not(:has(> :not([hidden]))) { display:none; }
  header #taskChip { position:static; border-radius:8px; }
  #play { min-width:6.6em; }   /* ▶ play / ❚❚ pause: the same width, so the top bar never re-wraps and moves the level */
  #views + #notice { position:static; transform:none; width:var(--col, auto); max-width:100%; box-sizing:border-box; margin:6px auto 0; box-shadow:none; }
  header #notice { position:static; transform:none; max-width:none; margin:4px 16px 6px; }
  header .cmpbar { padding:4px 10px; }
  .cmpbar[hidden], #stagebar[hidden], #secbar[hidden], #varbar[hidden] { display:none; }
  .cmpBtn { border-color:#ff7ad9 !important; color:#ffd0f0; font-weight:600; }
  button:disabled { opacity:.38; cursor:not-allowed; filter:grayscale(1); }
  .cmpBtn.on { background:#5a1f4a !important; color:#fff; }
  select, button, label.btn { background:#24184f; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button.on { background:#3b2d78; border-color:var(--cube); }
  #wrap { position:relative; }
  /* the level's zoom sits in the top bar, never over the level (Evgeni, 2026-11-27: "UI should be outside the gameplay windows") */
  /* the marks bar (CALM MARKS): one row above the level, always the same height, so typing a note never moves the level */
  #markBar { display:flex; flex-wrap:nowrap; gap:6px; align-items:center; height:38px; box-sizing:border-box; padding:0 10px; background:#120a2e; border-top:1px solid #2b2060; overflow-x:auto; overflow-y:hidden; white-space:nowrap; font-size:13px; scrollbar-width:thin; }
  #markBar button, #markBar select { padding:3px 8px; font-size:12px; flex:0 0 auto; }
  #markBar #mkPart { max-width:210px; }
  #markBar .mkAt { color:#ffe14d; flex:0 0 auto; }
  #markBar .mkHint { overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0; }
  #mkNote { flex:1 1 220px; min-width:120px; background:#0b0620; color:var(--ink); border:1px solid #6b5bd0; border-radius:6px; padding:5px 8px; font:inherit; }
  #markBar #mkSt { flex:0 0 auto; }
  #vz { display:inline-flex; gap:2px; }
  #vz button { padding:6px 8px; min-width:2em; }
  canvas { display:block; width:100%; height:min(60vh, 460px); background:#0e0828; touch-action:none; }
  #scrub { width:100%; margin:0; accent-color:var(--cube); }
  #strip { display:block; width:100%; height:34px; background:#120a2e; cursor:pointer; }
  #notice { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:60; max-width:min(92vw, 640px); background:#24184f; border:1px solid #6b5bd0; border-radius:8px; padding:8px 12px; font-size:13px; box-shadow:0 4px 18px rgba(0,0,0,.5); }
  #notice[hidden] { display:none; }
  #notice a { color:#9cf5c4; }
  #noteBox { position:fixed; inset:0; z-index:70; display:grid; place-items:center; background:rgba(11,6,32,.8); padding:16px; }
  #noteBox[hidden], #noteBox.at[hidden] { display:none; }   /* .at's display:block beat [hidden]: a pinned note box stayed on screen after save, its buttons dead */
  #noteBox .card { width:min(100%, 420px); background:#160d3a; border:1px solid #3b2d78; border-radius:10px; padding:12px; }
  #noteBox h2 { font-size:15px; margin:0 0 8px; }
  #noteBox textarea { width:100%; box-sizing:border-box; background:#0e0828; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:8px; font:inherit; font-size:16px; }
  #noteBox .row { display:flex; gap:8px; margin-top:8px; }
  #noteBox.at { display:block; background:rgba(11,6,32,.35); }
  #noteBox.at .card { position:fixed; }
  #noteBox .kinds { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 8px; }
  #noteBox .kinds button { padding:4px 10px; font-size:12px; }
  #noteBox .kinds button.on { border-color:var(--cube); background:#3b2d78; }
  #taskBox { position:fixed; inset:0; z-index:70; display:grid; place-items:center; background:rgba(11,6,32,.8); padding:16px; }
  #taskBox[hidden] { display:none; }
  #taskBox .card { width:min(100%, 480px); background:#160d3a; border:1px solid #3b2d78; border-radius:10px; padding:14px; font-size:14px; line-height:1.45; }
  #taskBox h2 { font-size:16px; margin:0 0 8px; }
  #taskBox p { margin:6px 0; }
  #taskBox .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  #taskChip { position:fixed; right:14px; bottom:14px; z-index:55; border-radius:16px; padding:6px 12px; background:#24184f; border:1px solid #6b5bd0; font-size:12px; }
  #taskChip[hidden] { display:none; }
  #stagebar { display:flex; flex-wrap:nowrap; overflow-x:auto; white-space:nowrap; scrollbar-width:thin; gap:6px; align-items:center; padding:3px 10px; background:#120a2e; border-top:1px solid #2b2060; font-size:13px; }
  #stagebar button { padding:3px 10px; font-size:12px; }
  #stagebar button.cur { border-color:var(--cube); background:#3b2d78; }
  #stagebar .todo { color:#6b5bd0; padding:3px 6px; }
  #stagebar .sep { color:#6b5bd0; }
  #varbar { display:flex; flex-wrap:nowrap; overflow-x:auto; white-space:nowrap; scrollbar-width:thin; gap:6px 14px; align-items:center; padding:3px 10px; background:#140b33; border-top:1px solid #2b2060; font-size:13px; }
  #labbar { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:6px 10px; background:#0f2a2a; border-top:1px solid #1f5a55; font-size:13px; }
  #labbar[hidden] { display:none; }
  #labbar .vname { color:#9ff0e2; }
  #labbar .lvars { display:flex; flex-wrap:wrap; gap:4px; }
  #labbar button { padding:4px 9px; font-size:12px; }
  #labbar button.cur { border-color:var(--cube); background:#3b2d78; }
  #labbar button.todo { opacity:.5; }
  #labbar button.pick { border-color:#ff7ab8; background:#4a1f3a; }
  #labbar button.close { margin-left:auto; }
  #labbar .lwhy, #labbar .lpick { flex-basis:100%; display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; }
  #labbar #labWhy { flex:1 1 14em; min-width:10em; padding:4px 6px; }
  @media (max-width:700px) { #labbar button { padding:8px 10px; font-size:13px; } }
  #varbar .vsec { display:flex; gap:4px; align-items:center; }
  #varbar .vname { color:#c9bdf8; margin-right:2px; }
  #varbar button { padding:3px 8px; font-size:12px; }
  #varbar button.cur { border-color:var(--cube); background:#3b2d78; }
  #varbar button.close { border-color:#ffb020; }
  #inbar { display:block; width:100%; height:58px; background:#0b0620; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:12px 16px 24px; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border-radius:8px; padding:12px; }
  .card h2 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  /* the clicks table: closed until asked for (the user: "all these clicks are still open"; it ran to 188 rows) */
  #clicksBox > summary { cursor:pointer; list-style-position:inside; color:var(--dim); }
  #clicksBox > summary h2 { display:inline; margin:0; }
  #clicksBox[open] > summary { margin-bottom:8px; }
  /* a wide screen (the PC): the level as GD frames it, 16:9 and as tall as the window allows, in the middle of the page
     with a gap under the top bar, and the bars and cards under it the same width (the user, 2026-11-25: "i want the ui
     more in the middle", "its way too stuck to the top, and the top ui hides the level a bit": a 1910 x 460 strip
     showed 44 blocks across and only 10 up, the top of the level cut at the canvas edge) */
  @media (min-width: 900px) {
    :root { --col: min(100%, max(640px, calc((100vh - 230px) * 16 / 9))); }
    #views:not(.split), #strip, #scrub, #clock, main, #labbar, #ver { width:var(--col); max-width:100%; margin-left:auto; margin-right:auto; box-sizing:border-box; }
    #views:not(.split) { margin-top:10px; }
    #scrub, #clock { display:block; }
    #views:not(.split) #cv { height:auto; aspect-ratio:16/9; }
    main { padding-left:0; padding-right:0; }
  }
  .ok { color:var(--cube); } .bad { color:var(--spike); }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:3px 6px; border-bottom:1px solid #2a1f57; }
  tr.now td { color:var(--click); }
  .muted { color:var(--dim); }
  canvas.marking { cursor:crosshair; }
  tr.done td { color:var(--dim); text-decoration:line-through; }
  #views.split { display:grid; grid-template-columns:1fr 1fr; }
  #views.split canvas, #views.split #cmpImg { height:auto; aspect-ratio:16/9; }
  #cmp { background:#000; display:flex; flex-direction:column; }
  #cmp[hidden] { display:none; }
  .cmpbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:4px 6px; background:var(--panel); }
  .cmpbar input { background:#24184f; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:4px; }
  #cmpImg { width:100%; height:min(60vh, 460px); object-fit:contain; object-position:center top; }
  @media (max-width: 700px) { #views.split { grid-template-columns:1fr; } }
  #drop { position:absolute; inset:0; display:none; place-items:center; background:rgba(11,6,32,.85); font-size:18px; border:2px dashed var(--cube); }
  #workBox { position:fixed; inset:0; z-index:50; background:rgba(6,3,20,.72); display:flex; justify-content:center; align-items:flex-start; padding:4vh 12px; }
  #workBox[hidden] { display:none; }
  #wk { width:min(860px,100%); max-height:92vh; display:flex; flex-direction:column; background:#160d3a; border:1px solid #3b2d78; border-radius:10px; overflow:hidden; }
  #wkTop { display:flex; gap:10px; align-items:center; padding:10px; border-bottom:1px solid #2b2060; }
  #wkTop b { font-size:15px; } #wkTop .muted { flex:1; font-size:12px; }
  #wkList { overflow-y:auto; padding:8px 12px 14px; font-size:13px; }
  #wkList h3 { font-size:12px; color:#9c8ee0; text-transform:uppercase; letter-spacing:.06em; margin:12px 0 6px; }
  .wkCard { border:1px solid #3b2d78; border-radius:8px; padding:8px 10px; margin:6px 0; background:#1b1145; }
  .wkCard.open { border-color:#ffb020; }
  .wkCard .opts { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .wkRow { display:flex; gap:8px; align-items:center; padding:6px 4px; border-bottom:1px solid #241a52; cursor:pointer; }
  .wkRow:hover { background:#24184f; }
  .wkRow .nm { font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #stagebar .rev { padding:3px 8px; font-size:12px; }
  #stagebar .gate { color:#ffd58a; }
  #secbar { display:flex; flex-wrap:nowrap; overflow-x:auto; gap:6px; align-items:center; padding:3px 10px; background:#120a2e; font-size:12px; white-space:nowrap; scrollbar-width:thin; }
  #secbar > * { flex:none; }
  #secbar .secT { background:none; border-color:#2b2060; color:var(--dim); }
  #secbar .sec { display:inline-flex; gap:3px; align-items:center; padding:2px 6px; border:1px solid #2b2060; border-radius:6px; cursor:pointer; }
  #secbar .sec.here { border-color:#6b5bd0; }
  #secbar .sec.sel { border-color:var(--cube); background:#2a1f5c; }
  #secbar .role { font-size:10px; padding:0 4px; border-radius:4px; background:#2b2a44; color:#aaa; }
  #secbar .role.built { background:#24356b; color:#cfe0ff; } #secbar .role.ok, #secbar .role.joined { background:#16402c; color:#9cf5c4; } #secbar .role.redo { background:#5a1424; color:#ffb3c2; }
  #secbar button { padding:2px 8px; font-size:12px; }
  #picker { position:fixed; inset:0; z-index:50; background:rgba(6,3,20,.72); display:flex; justify-content:center; align-items:flex-start; padding:4vh 12px; }
  #picker[hidden] { display:none; }
  #pk { width:min(860px,100%); max-height:92vh; display:flex; flex-direction:column; background:#160d3a; border:1px solid #3b2d78; border-radius:10px; overflow:hidden; }
  #pkTop { display:flex; gap:8px; flex-wrap:wrap; padding:10px; border-bottom:1px solid #2b2060; align-items:center; }
  #pkQ { flex:1 1 220px; min-width:160px; background:#0e0828; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:8px 10px; font:inherit; }
  #pkTop button.on { border-color:var(--cube); background:#3b2d78; }
  #pkList { overflow-y:auto; padding:6px; }
  .pkHead { color:#9c8ee0; font-size:12px; margin:8px 6px 4px; text-transform:uppercase; letter-spacing:.06em; }
  .pkCard { display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .pkCard:hover, .pkCard.sel { background:#24184f; border-color:#4a3a98; }
  .pkCard canvas { width:200px; height:34px; flex:0 0 auto; border-radius:4px; background:#0b0620; }
  .pkInfo { flex:1; min-width:0; }
  .pkName { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pkMeta { font-size:12px; color:#a99ce6; margin-top:2px; }
  .pkBadge { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px; background:#2c2166; color:#d8d0ff; margin-right:4px; }
  .pkBadge.wip { background:#5a3a10; color:#ffd58a; }
  .pkPin { background:none; border:none; font-size:18px; color:#6b5bd0; cursor:pointer; padding:4px 6px; }
  .pkPin.on { color:#ffe14d; }
  .pkOlder { font-size:12px; margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; }
  .pkOlder button { font-size:11px; padding:2px 6px; }
  @media (max-width:700px) { #picker { padding:0; } #pk { max-height:100vh; height:100vh; border-radius:0; } .pkCard { padding:12px 8px; } .pkCard canvas { width:120px; } #pkTop button { padding:10px 12px; } }
/* HOVER ON EVERY BUTTON (Evgeni 2026-11-27: "all UI buttons should have some hover effect, in all workbooks forever").
   Paste once into every page we make (catalogues, boards, viewers, artifacts); tests/hover_rule.js checks the pages. */
button,.btn,[role=button],select,summary,input[type=button],input[type=submit]{transition:filter .12s,transform .12s,box-shadow .12s,background-color .12s}
button:hover:not(:disabled),.btn:hover,[role=button]:hover,select:hover,summary:hover,input[type=button]:hover,input[type=submit]:hover{filter:brightness(1.18);box-shadow:0 0 0 2px rgba(120,170,255,.35);cursor:pointer}
button:active:not(:disabled),.btn:active,[role=button]:active{transform:translateY(1px);filter:brightness(.95)}
</style>
</head>
<body>
<div id="workBox" hidden><div id="wk" role="dialog" aria-label="work">
  <div id="wkTop"><b>Work</b><span class="muted" id="wkWhen"></span><button id="wkClose" title="close (Esc)">✕</button></div>
  <div id="wkList"></div></div></div>
<div id="picker" hidden><div id="pk" role="dialog" aria-label="choose a level">
  <div id="pkTop"><input id="pkQ" type="search" placeholder="search levels…" autocomplete="off">
    <button data-f="main" class="on" title="our finished levels and the official ones (work in progress, the lab and experiments have their own tabs)">main</button><button data-f="recent">recent</button><button data-f="pinned">★ pinned</button><button data-f="runs" title="every level you played -- here (🎮) or in GD recordings (🎥) -- newest first; opens on your latest run as a ghost">my runs</button><button data-f="wip">in progress</button><button data-f="lab" title="the section lab's variants, the lab and test levels">lab</button><button data-f="ours">ours</button><button data-f="official">official</button><button data-f="community">community</button><button data-f="demons" title="the demon list's top 150 and every former Top 1 that is on this PC (local/community, tools/demonlist.js), by list place">demon list</button><button data-f="all">all</button>
    <button id="pkClose" title="close (Esc)">✕</button></div>
  <div id="pkList"></div></div></div>
<header>
  <h1>GD LEVEL VIEWER</h1>
  <select id="pick" hidden></select><button id="workBtn" title="what the sessions are building, what waits for you, the PC's queue (key W)">work <span id="workBadge" class="pkBadge wip" hidden></span></button><button id="pickBtn" title="choose a level (key L)">📂 <span id="pickName">levels</span></button>
  <button id="refresh" title="get the newest version of the sessions' levels">⟳ refresh</button>
  <button id="linkBtn" title="copy a link to this level at this moment">🔗 link</button>
  <label class="btn">open .gdlvl<input id="file" type="file" accept=".gdlvl,.txt" hidden></label>
  <button id="play">▶ play</button>
  <button id="restart">⟲</button>
  <select id="runPick" hidden></select><button id="runChip" class="cmpBtn" hidden title="the run you are watching; ▾ your other runs of this level"></button><button id="runClose" class="cmpBtn" hidden title="leave run mode (back to the level)">✕</button><div id="runMenu" class="cmpbar" hidden style="position:absolute;z-index:65;flex-direction:column;align-items:stretch;border:1px solid #6b5bd0;border-radius:8px;max-height:60vh;overflow:auto"></div><button id="runRoute" class="cmpBtn" disabled title="pick a run first">⇄ compare</button>
  <button id="youPlay" title="play it yourself here: space / click / tap = jump, R = restart, P = back to the replay (practice checkpoints at each section)">🎮 you play</button><button id="drawBtn" title="draw a level here: ground, blocks, spikes, orbs, pads, portals, deco and where you jump; 🧩 layout makes it a level as you draw; ▶ and 🎮 replay and play it in this viewer (key D)">✏ draw</button><button id="practiceBtn" class="on" hidden title="practice: after a death, start again from the last checkpoint (each section / portal)">practice</button>
  <button data-speed="0.25">¼×</button><button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button>
  <button id="lookBtn" class="on" title="colours, triggers, block skins as in the game (off: the schematic view)">game look</button>
  <button id="artBtn" title="draw objects, background, ground and icon with GD's own sprites from your game install (needs tools/serve.js; VISUALS.md)">GD art</button>
  <button id="mapBtn" title="the whole level as one picture with its path (make it with node tools/levelmap.js <level>)">level map</button>
  <button id="hit">hitboxes</button>
  <button id="cmpBtn" hidden title="a frame of your recording next to the replay (needs tools/serve.js)">compare</button>
  <button id="markBtn" title="pause, then click where something should change (key M)">✎ mark</button>
  <button id="sound" class="on" title="a click on each press of the replay">click sound</button><select id="soundKind" title="what the click sounds like: a mouse button, a mechanical key, or the old beep"><option value="mouse">🖱 mouse</option><option value="keyboard">⌨ keyboard</option><option value="beep">beep</option></select>
  <button id="music" class="on">music</button><label class="btn" id="addSongPc" hidden>add song<input id="songFilePc" type="file" accept="audio/*,.mp3,.ogg,.m4a,.wav" hidden></label>
  <button id="lightBtn" title="light mode: no GD art, no beat lines -- for a slow moment (the PC busy, the phone)">light</button>
  <button id="beatsBtn" class="on" title="beat grid of the level's song (songs on this PC, from tools/beats.js)">beats</button>
  <button id="windowsBtn" title="each input's timing window in the button band (the range of moments that still work)">timing windows</button>
  <button id="legendBtn" title="what the marks in the button band mean">band legend</button>
  <button id="camBtn" title="camera only: the level from start to end at its speed, no player (for levels the sim cannot beat)">camera only</button>
  <button id="taskChip" hidden title="what the PC is doing for you (click for details)"></button>
  <div id="vz" title="zoom the level only (wheel or pinch on the level, keys - and =)"><button id="vzOut">−</button><button id="vzFit" title="back to the game's view (100%)">100%</button><button id="vzIn">+</button></div>
  <button id="viewBtn" title="view options: speed, look, GD art, level map, hitboxes, sounds, beats, the button band's windows and legend (remembered)">⚙ view</button>
  <div id="viewMenu" hidden></div>
</header>
<div id="views"><div id="wrap"><canvas id="cv"></canvas><canvas id="inbar" title="the button. Middle lane: what the replay presses -- a tap is a short white mark with a dot, a hold a yellow bar with its length. Top lane: each input's timing window, the whole range of moments that still work (cyan for a press, pink for a release): a long window is room, not a long press."></canvas><div id="drop">drop a .gdlvl here</div></div>
<div id="cmp" hidden><div class="cmpbar"><select id="cmpRec"></select>

// take (the heavy-job queue: GET /heavy/status) and what happens after; Start runs it, and a small chip shows its

// -> Promise<bool>, done(), state}.
const TASKS = [];

// the queue in words: who runs, how many wait, and the time until this job is done -- only from measurements (the

const etaWords = (min, basis, unknown) => min == null ? "time not measured" : `${unknown ? "at least " : "about "}${min} min <span class="muted">(${esc(basis || "measured")}${unknown ? `; ${unknown} job${unknown === 1 ? "" : "s"} ahead not measured` : ""})</span>`;

      (q.holders.length ? `; the running job${q.holders.length === 1 ? "" : "s"} need${q.holders.length === 1 ? "s" : ""} ${etaWords(w.wait, "their measured runs", w.unknown)} more` : "") + `, then ${takes}.`;

    if (Date.now() - t.t0 > 60 * 60e3) { t.state = "done"; notice(esc(t.label) + ": still not done after an hour -- the PC may be busy (node tools/heavy.js shows the queue)."); }

loadMarks();
requestAnimationFrame(frame);

// ---------- ✏ draw: the whiteboard (viewer/draw.html) as a layer on this canvas (DRAW.md "In the viewer") ----------
// The board runs in a frame over the canvas with a see-through background: its pens, stamps and marks on top, and this
// viewer drawing the level the sketch becomes (or its 🧩 layout) underneath, with the game look, at the board's camera.
// ▶ / 🎮 on the board leave draw mode and replay / play that level here; ✏ draw goes back to the drawing.
const DRAWM = { on: false, fr: null, last: null, lv: null };
// while drawing, the viewer's own ▶ play and 🎮 you play leave the board first and then run the sketch (one way to play
// it, never a replay hidden under the board)
document.addEventListener("click", e => { if (DRAWM.on && e.target.closest && e.target.closest("#play, #youPlay")) drawMode(false); }, true);
window.BOARDHOST = {
  get claude() { return window.claude || null; },
  view(V, rect, Hb) {   // the board's camera: V {x, y, z} in its canvas' css px; rect = its canvas in the frame
    DRAWM.last = { V: Object.assign({}, V), rect, Hb };
    if (!DRAWM.on || !DRAWM.fr) return;
    const d = DPR(), fr = DRAWM.fr.getBoundingClientRect(), c = cv.getBoundingClientRect();
    const ox = fr.left + rect.left - c.left, oy = fr.top + rect.top - c.top;
    MAPCAM = { x: V.x - ox / V.z, y: V.y, scale: V.z * d, groundY: (Hb + oy) * d };
    if (L) draw();
  },
  setLevel(name, levelStr, saved, song) {   // the sketch as a level (converted or fitted), with the plan to replay
    DRAWM.lv = { name, levelStr, saved, song };
    // the sketch carries its song's beat grid (sk.song.grid): bars and sections show even where no grid file is
    if (song && song.url && song.grid && !(window.GD_BEATS || {})[song.url]) (window.GD_BEATS = window.GD_BEATS || {})[song.url] = song.grid;
    try { load(name, levelStr, saved, song || null); } catch (e) { console.warn("draw: the level did not load", e); return; }
    // the sketch is the level now: the last level's build stages, sections and variants are not its own (they stayed on
    // screen over the board and acted on that other level: the user, 2026-11-25 "something buggy with sections")
    STG.base = STG.data = STG.cur = null; VAR.base = VAR.data = VAR.cur = null; clearTimeout(VAR.poll);
    stageRender(); varRender();
    t = 0; playing = false; setPlay(); if (typeof summary === "function") summary();
    document.getElementById("pickName").textContent = name;
    if (DRAWM.on && DRAWM.last) BOARDHOST.view(DRAWM.last.V, DRAWM.last.rect, DRAWM.last.Hb); else if (L) draw();
  },
  addSongFile(f) {   // a song picked on the board: the viewer plays it too (the phone page's add song)
    if (typeof takeSongFiles === "function") return takeSongFiles([f]);
    if (typeof keepSong === "function" && songInfo) f.arrayBuffer().then(b => { keepSong(songKeyOf(songInfo), b); delete songLoading[songKeyOf(songInfo)]; syncSong(true); });
  },
  play(kind, x) {   // "replay" from x (the board's view), "you" = 🎮 from the start
    if (!L) return; drawMode(false);
    if (kind === "you") { if (!PLAY.on) playStart(); return; }
    const i = x == null ? 0 : L.path.findIndex(s => s.x >= x); t = Math.max(0, (i < 0 ? 0 : i) / P.TPS); lastTick = -1;
    playing = true; setPlay(); syncSong(true);
  },
  exit() { drawMode(false); },
};
function drawMode(on) {
  if (on === DRAWM.on) return; DRAWM.on = on;
  const b = document.getElementById("drawBtn"); b.classList.toggle("on", on); b.textContent = on ? "✏ drawing (D: done)" : "✏ draw";
  for (const id of ["stagebar", "secbar", "varbar"]) { const e = document.getElementById(id); if (on) { e.dataset.drawHid = e.hidden ? "" : "1"; e.hidden = true; } }
  if (on) {
    if (PLAY && PLAY.on) playStop(true); if (marking) setMarking(false); playing = false; setPlay(); syncSong(false);
    // the level keeps its size and place (Evgeni, 2026-11-28: "no big flashes no big jumps"): the board takes the canvas' box
    markClose();
    if (!DRAWM.fr) {
      const fr = DRAWM.fr = document.createElement("iframe"); fr.id = "drawFrame"; fr.title = "the whiteboard";
      fr.src = "draw.html?embed=1" + (MUTED ? "&mute=1" : "") + (TESTPAGE ? "&test=1" : ""); fr.setAttribute("allowtransparency", "true");
      fr.style.cssText = "position:absolute;left:0;border:0;width:100%;z-index:6;background:transparent;color-scheme:normal";
      document.getElementById("wrap").appendChild(fr);
      setTimeout(() => { let up = false; try { up = !!fr.contentWindow.DRAW; } catch (e) {}
        if (!up && DRAWM.on) notice("The board did not open here (this page may not allow it). The whiteboard also works as a page of its own.", 8000); }, 6000);
    }
    DRAWM.fr.style.top = cv.offsetTop + "px"; DRAWM.fr.style.height = cv.getBoundingClientRect().height + "px"; DRAWM.fr.hidden = false;
    // opening the board keeps the level on screen (Evgeni, 2026-11-25: "when i move to drawing it switches"): the last
    // sketch comes back only when nothing else is open; drawing a stroke then shows the sketch, as before
    if (DRAWM.lv && !L) BOARDHOST.setLevel(DRAWM.lv.name, DRAWM.lv.levelStr, DRAWM.lv.saved, DRAWM.lv.song);
    if (DRAWM.last) BOARDHOST.view(DRAWM.last.V, DRAWM.last.rect, DRAWM.last.Hb);
    try { DRAWM.fr.contentWindow.focus(); } catch (e) {}
  } else {
    if (DRAWM.fr) DRAWM.fr.hidden = true; MAPCAM = null;
    if (L) draw();   // closing the board keeps what is on screen too
  }
}
document.getElementById("drawBtn").onclick = () => drawMode(!DRAWM.on);
addEventListener("keydown", e => { if (e.key === "d" && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !(PLAY && PLAY.on)) drawMode(!DRAWM.on); });
addEventListener("resize", () => { if (DRAWM.on) { DRAWM.on = false; drawMode(true); } });
if (hashParams().get("draw")) setTimeout(() => drawMode(true), 0);
// ---------- embedded (viewer/polish.html: before / after side by side) ----------
// #embed=1 hides the controls; the parent page drives the clock through window.VIEWER.
if (hashParams().get("embed")) {
  document.querySelector("header").style.display = "none"; document.querySelector("main").style.display = "none";
  document.getElementById("scrub").style.display = "none"; sound = false; music = false;
}
window.VIEWER = {
  load(name, levelStr, saved, info) { load(name, levelStr, saved, info); },
  seek(tt) { if (!L) return; t = Math.max(0, Math.min(tt, (L.path.length - 1) / P.TPS)); playing = false; draw(); },
  timeOfX(x) { if (!L) return 0; const i = L.path.findIndex(s => s.x >= x); return (i < 0 ? L.path.length - 1 : i) / P.TPS; },
  get t() { return t; }, get len() { return L ? (L.path.length - 1) / P.TPS : 0 },
  setArt(on) { if (art !== !!on) artBtn.onclick(); },
  setHit(on) { if (showHit !== !!on) document.getElementById("hit").onclick({ target: document.getElementById("hit") }); },
};
</script>
